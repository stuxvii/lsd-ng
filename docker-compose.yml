version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    image: php:8.3-fpm
    volumes:
      - ./src:/var/www/html

  sql:
    image: mariadb:lts-ubi10
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: change_this_fam 
      MARIADB_DATABASE: lsd
      MARIADB_USER: lsd
      MARIADB_PASSWORD: set_at_.env_please 
    volumes:
      - mariadb_data:/var/lib/mysql

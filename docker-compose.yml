services:
  web:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./src:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: .
    volumes:
      - ./src:/var/www/html

  sql:
    image: mariadb:lts-ubi10
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: lsd
      MARIADB_USER: lsd
    env_file:
      - .env 
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
